<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Placement Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div id="app">
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4" v-if="isAuthenticated">
            <div class="container">
                <span class="navbar-brand">CampusConnect</span>
                <div class="collapse navbar-collapse">
                    <ul class="navbar-nav me-auto">
                        <template v-if="userRole === 'admin'">
                            <li class="nav-item"><router-link class="nav-link" to="/admin">Dashboard</router-link></li>
                            <li class="nav-item"><router-link class="nav-link" to="/admin/approvals">Approvals</router-link></li>
                            <li class="nav-item"><router-link class="nav-link" to="/admin/users">Users</router-link></li>
                            <li class="nav-item"><router-link class="nav-link" to="/admin/drives">All Drives</router-link></li>
                            <li class="nav-item"><router-link class="nav-link" to="/admin/applications">Log</router-link></li>
                        </template>
                        <template v-if="userRole === 'company'">
                            <li class="nav-item"><router-link class="nav-link" to="/company">My Drives</router-link></li>
                            <li class="nav-item"><router-link class="nav-link" to="/company/create">Post Drive</router-link></li>
                        </template>
                        <template v-if="userRole === 'student'">
                            <li class="nav-item"><router-link class="nav-link" to="/student">Find Drives</router-link></li>
                            <li class="nav-item"><router-link class="nav-link" to="/student/applications">My Applications</router-link></li>
                            <li class="nav-item"><router-link class="nav-link" to="/student/profile">Profile</router-link></li>
                        </template>
                    </ul>
                    <button class="btn btn-danger btn-sm" @click="logout">Logout</button>
                </div>
            </div>
        </nav>

        <div class="container">
            <router-view></router-view>
        </div>
    </div>

    <template id="login-template">
        <div class="row justify-content-center mt-5">
            <div class="col-md-4">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h3 class="text-center mb-4">Login</h3>
                        <form @submit.prevent="login">
                            <div class="mb-3">
                                <label class="form-label">Username</label>
                                <input type="text" class="form-control" v-model="username" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Password</label>
                                <input type="password" class="form-control" v-model="password" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Login</button>
                        </form>
                        <div class="mt-3 text-center">
                            <router-link to="/register">Register New Account</router-link>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </template>

    <template id="register-template">
        <div class="row justify-content-center mt-5">
            <div class="col-md-6">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h3 class="text-center mb-4">Register</h3>
                        <form @submit.prevent="register">
                            <select class="form-select mb-3" v-model="role" required>
                                <option value="student">Student</option>
                                <option value="company">Company</option>
                            </select>
                            
                            <input type="text" class="form-control mb-3" v-model="username" placeholder="Username" required>
                            <input type="password" class="form-control mb-3" v-model="password" placeholder="Password" required>
                            <input type="email" class="form-control mb-3" v-model="email" placeholder="Email" required>
                            
                            <div v-if="role === 'student'" class="border p-3 mb-3 bg-light">
                                <h5>Student Details</h5>
                                <input type="text" class="form-control mb-2" v-model="fullname" placeholder="Full Name" required>
                                <input type="number" step="0.01" class="form-control mb-2" v-model="cgpa" placeholder="CGPA" required>
                                <input type="text" class="form-control mb-2" v-model="branch" placeholder="Branch" required>
                                <input type="number" class="form-control mb-2" v-model="graduation_year" placeholder="Graduation Year" required>
                            </div>

                            <div v-if="role === 'company'" class="border p-3 mb-3 bg-light">
                                <h5>Company Details</h5>
                                <input type="text" class="form-control mb-2" v-model="company_name" placeholder="Company Name" required>
                                <input type="text" class="form-control mb-2" v-model="hr_contact" placeholder="HR Contact Name" required>
                                <input type="url" class="form-control mb-2" v-model="website" placeholder="Website URL">
                            </div>

                            <button type="submit" class="btn btn-primary w-100 mb-2">Submit Registration</button>
                            <button type="button" class="btn btn-secondary w-100" @click="$router.push('/login')">Cancel</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </template>

    <template id="admin-dash-template">
        <div>
            <h2>Admin Dashboard</h2>
            <div class="row mt-4">
                <div class="col-md-4">
                    <div class="card text-center bg-primary text-white mb-3">
                        <div class="card-body">
                            <h3>Students</h3>
                            <h2>[[ stats.students ]]</h2>
                        </div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="card text-center bg-success text-white mb-3">
                        <div class="card-body">
                            <h3>Companies</h3>
                            <h2>[[ stats.companies ]]</h2>
                        </div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="card text-center bg-info text-white mb-3">
                        <div class="card-body">
                            <h3>Drives</h3>
                            <h2>[[ stats.drives ]]</h2>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </template>

    <template id="admin-approvals-template">
        <div>
            <h2>Approvals</h2>
            <h4 class="mt-4">Pending Companies</h4>
            <table class="table table-bordered bg-white">
                <thead><tr><th>Company Name</th><th>Action</th></tr></thead>
                <tbody>
                    <tr v-for="c in companies" v-show="c.approval_status === 'Pending'" :key="c.company_id">
                        <td>[[ c.company_name ]]</td>
                        <td>
                            <button class="btn btn-sm btn-success me-2" @click="actionCompany(c.company_id, 'approve')">Approve</button>
                            <button class="btn btn-sm btn-danger" @click="actionCompany(c.company_id, 'reject')">Reject</button>
                        </td>
                    </tr>
                </tbody>
            </table>

            <h4 class="mt-5">Pending Drives</h4>
            <table class="table table-bordered bg-white">
                <thead><tr><th>Job Title</th><th>Company</th><th>Action</th></tr></thead>
                <tbody>
                    <tr v-for="d in pendingDrives" :key="d.drive_id">
                        <td>[[ d.job_title ]]</td>
                        <td>[[ d.company ]]</td>
                        <td>
                            <button class="btn btn-sm btn-success me-2" @click="actionDrive(d.drive_id, 'approve')">Approve</button>
                            <button class="btn btn-sm btn-danger" @click="actionDrive(d.drive_id, 'reject')">Reject</button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </template>

    <template id="admin-users-template">
        <div>
            <h2>Manage Users</h2>
        <div class="card mb-4 shadow-sm">
                <div class="card-body d-flex gap-2">
            <input 
                type="text" 
                class="form-control" 
                v-model="searchQuery" 
                placeholder="Search students or companies by username..."
                @keyup.enter="executeSearch"
        >
            <button class="btn btn-primary px-4" @click="executeSearch">
                Search
            </button>
            <button class="btn btn-secondary px-4" @click="resetSearch">
                Clear
            </button>
    </div>
</div>
            <table class="table table-bordered bg-white mt-3">
                <thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Status</th><th>Action</th></tr></thead>
                <tbody>
                    <tr v-for="user in users" :key="user.user_id">
                        <td>[[ user.name ]]</td>
                        <td>[[ user.email ]]</td>
                        <td>[[ user.type ]]</td>
                        <td>[[ user.is_blacklisted ? 'Blocked' : 'Active' ]]</td>
                        <td>
                            <button class="btn btn-sm btn-warning" @click="toggleBlacklist(user.user_id)">
                                [[ user.is_blacklisted ? 'Unblock' : 'Block' ]]
                            </button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </template>

    <template id="admin-drives-template">
        <div>
            <h2>All Drives</h2>
            <table class="table table-bordered bg-white mt-3">
                <thead><tr><th>Job Title</th><th>Company</th><th>Status</th><th>Action</th></tr></thead>
                <tbody>
                    <tr v-for="drive in drives" :key="drive.drive_id">
                        <td>[[ drive.job_title ]]</td>
                        <td>[[ drive.company ]]</td>
                        <td>[[ drive.status ]]</td>
                        <td>
                            <button v-if="drive.status === 'Approved'" class="btn btn-sm btn-danger" @click="closeDrive(drive.drive_id)">Close</button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </template>

    <template id="admin-applications-template">
        <div>
            <h2>Applications Log</h2>
            <table class="table table-bordered bg-white mt-3">
                <thead><tr><th>Student</th><th>Company</th><th>Job Title</th><th>Status</th></tr></thead>
                <tbody>
                    <tr v-for="app in applications" :key="app.application_id">
                        <td>[[ app.student ]]</td>
                        <td>[[ app.company ]]</td>
                        <td>[[ app.job_title ]]</td>
                        <td>[[ app.status ]]</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </template>

    
<template id="student-dash-template">
        <div>
            <h2>Available Drives</h2>
            
            <!-- SEARCH BAR FOR STUDENTS -->
            <div class="mb-4 mt-3">
                <input 
                    type="text" 
                    class="form-control shadow-sm" 
                    v-model="searchQuery" 
                    placeholder="Search by job title or branch..."
                >
            </div>

            <div class="row mt-4">
                <!-- CHANGED: 'drive in drives' is now 'drive in filteredDrives' -->
                <div class="col-md-6 mb-3" v-for="drive in filteredDrives" :key="drive.drive_id">
                    <div class="card shadow-sm">
                        <div class="card-body">
                            <h4>[[ drive.job_title ]]</h4>
                            <h5>[[ drive.company ]]</h5>
                            <p><strong>CGPA Required:</strong> [[ drive.eligibility_cgpa ]]</p>
                            <p><strong>Branches:</strong> [[ drive.eligibility_branch ]]</p>
                            <p><strong>Deadline:</strong> [[ drive.application_deadline ]]</p>
                            <button class="btn btn-primary" @click="apply(drive.drive_id)">Apply Now</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </template>

    <template id="student-applications-template">
        <div>
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h2>My Applications</h2>
                <button class="btn btn-success" @click="exportCSV">Export CSV Report</button>
            </div>
            <table class="table table-bordered bg-white">
                <thead><tr><th>Company</th><th>Job Title</th><th>Date</th><th>Status</th></tr></thead>
                <tbody>
                    <tr v-for="app in applications" :key="app.application_id">
                        <td>[[ app.company ]]</td>
                        <td>[[ app.job_title ]]</td>
                        <td>[[ app.application_date ]]</td>
                        <td>[[ app.status ]]</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </template>

    <template id="student-profile-template">
        <div class="row">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-body">
                        <h2>My Profile</h2>
                        <form @submit.prevent="updateProfile">
                            <label>Full Name</label>
                            <input type="text" class="form-control mb-2" v-model="profile.fullname" required>
                            <label>CGPA</label>
                            <input type="number" step="0.01" class="form-control mb-2" v-model="profile.cgpa" required>
                            <label>Branch</label>
                            <input type="text" class="form-control mb-2" v-model="profile.branch" required>
                            <label>Graduation Year</label>
                            <input type="number" class="form-control mb-2" v-model="profile.graduation_year" required>
                            <label>Resume Link</label>
                            <input type="url" class="form-control mb-3" v-model="profile.resume_link" required>
                            <button type="submit" class="btn btn-primary">Save Profile</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </template>

    <template id="company-dash-template">
        <div class="card mb-4 shadow-sm">
    <div class="card-header bg-primary text-white">
        <h5 class="mb-0">Company Profile</h5>
    </div>
    <div class="card-body">
        <div class="row">
            <div class="col-md-4">
                <strong>Company Name:</strong> [[ profile.company_name ]]
            </div>
            <div class="col-md-4">
                <strong>HR Contact:</strong> [[ profile.hr_contact ]]
            </div>
            <div class="col-md-4">
                <strong>Website:</strong> 
                <a :href="profile.website" target="_blank">[[ profile.website ]]</a>
            </div>
        </div>
        <div class="mt-3">
            <strong>Status:</strong> 
            <span class="badge" :class="profile.approval_status === 'Approved' ? 'bg-success' : 'bg-warning text-dark'">
                [[ profile.approval_status ]]
            </span>
        </div>
    </div>
</div>
        <div>
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2>My Drives</h2>
                <button class="btn btn-primary" @click="$router.push('/company/create')">Post New Drive</button>
            </div>
            
            <div v-for="drive in drives" :key="drive.drive_id" class="card mb-4 shadow-sm">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <h5 class="mb-0">[[ drive.job_title ]] ([[ drive.status ]])</h5>
                    <button class="btn btn-sm btn-secondary" @click="viewApplicants(drive.drive_id)">View Applicants

                    <span class="badge bg-light text-dark rounded-pill">
                        [[ drive.applicant_count ]]
                    </span>
                    </button>
                </div>
                <div class="card-body" v-if="selectedDrive === drive.drive_id">
                    <table class="table table-sm">
                        <thead><tr><th>Name</th><th>CGPA</th><th>Resume</th><th>Status</th><th>Actions</th></tr></thead>
                        <tbody>
                            <tr v-for="app in applicants" :key="app.application_id">
                                <td>[[ app.student_name ]]</td>
                                <td>[[ app.cgpa ]]</td>
                
                                <td><a :href="app.resume_link" target="_blank">View</a></td>
                                <td>[[ app.status ]]</td>
                                <td>
                                    <button class="btn btn-sm btn-info me-1" @click="updateStatus(app.application_id, 'Shortlisted')">Shortlist</button>
                                    <button class="btn btn-sm btn-success me-1" @click="updateStatus(app.application_id, 'Selected')">Select</button>
                                    <button class="btn btn-sm btn-danger" @click="updateStatus(app.application_id, 'Rejected')">Reject</button>
                                    <button v-if="app.status === 'Selected'" class="btn btn-sm btn-warning ms-1" @click="sendOfferEmail(app.application_id)">Email Offer</button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </template>

    <template id="company-create-drive-template">
        <div class="row">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-body">
                        <h2>Create Placement Drive</h2>
                        <form @submit.prevent="submitDrive" class="mt-3">
                            <input type="text" class="form-control mb-2" v-model="form.job_title" placeholder="Job Title" required>
                            <textarea class="form-control mb-2" v-model="form.job_description" placeholder="Description" required></textarea>
                            <input type="number" step="0.1" class="form-control mb-2" v-model="form.eligibility_cgpa" placeholder="Minimum CGPA" required>
                            <input type="text" class="form-control mb-2" v-model="form.eligibility_branch" placeholder="Eligible Branches" required>
                            <input type="number" class="form-control mb-2" v-model="form.eligibility_year" placeholder="Target Year" required>
                            <label>Application Deadline</label>
                            <input type="date" class="form-control mb-3" v-model="form.application_deadline" required>
                            
                            <button type="submit" class="btn btn-primary">Submit for Approval</button>
                            <button type="button" class="btn btn-secondary ms-2" @click="$router.push('/company')">Cancel</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </template>

    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://unpkg.com/vue-router@4.0.13/dist/vue-router.global.js"></script>
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
    <script src="/static/app.js"></script>
</body>
</html>
